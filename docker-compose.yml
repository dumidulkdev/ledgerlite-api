services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ledgerlite
      POSTGRES_USER: ledgerlite
      POSTGRES_PASSWORD: ledgerlite
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerlite -d ledgerlite"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ledgerlite
      DB_USER: ledgerlite
      DB_PASSWORD: ledgerlite
    depends_on:
      postgres:
        condition: service_healthy